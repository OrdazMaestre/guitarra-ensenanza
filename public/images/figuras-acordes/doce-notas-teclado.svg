<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" role="img" aria-labelledby="title desc">
  <title id="title">Las doce notas en forma de teclado</title>
  <desc id="desc">Las doce notas en fila, representadas como teclas de piano que se tocan entre si: las naturales muestran su nombre en el centro y las alteradas muestran el sostenido arriba y el bemol abajo, alineados con el nombre de las naturales.</desc>
  <rect width="700" height="160" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <g fill="#f7f8fb" stroke="#7c8798" stroke-width="1.4">
      <rect x="25" y="10" width="75" height="140" rx="8"/>
      <rect x="100" y="10" width="100" height="140" rx="8"/>
      <rect x="200" y="10" width="75" height="140" rx="8"/>
      <rect x="275" y="10" width="75" height="140" rx="8"/>
      <rect x="350" y="10" width="100" height="140" rx="8"/>
      <rect x="450" y="10" width="100" height="140" rx="8"/>
      <rect x="550" y="10" width="75" height="140" rx="8"/>
      <rect x="625" y="10" width="50" height="140" rx="8"/>
    </g>
    <g fill="#d1d5db" stroke="#7c8798" stroke-width="1.4">
      <rect x="75" y="10" width="50" height="115" rx="8"/>
      <rect x="175" y="10" width="50" height="115" rx="8"/>
      <rect x="325" y="10" width="50" height="115" rx="8"/>
      <rect x="425" y="10" width="50" height="115" rx="8"/>
      <rect x="525" y="10" width="50" height="115" rx="8"/>
    </g>
    <g font-weight="800" fill="#14213d">
      <text x="50" y="72" font-size="26">C</text>
      <text x="150" y="72" font-size="26">D</text>
      <text x="250" y="72" font-size="26">E</text>
      <text x="300" y="72" font-size="26">F</text>
      <text x="400" y="72" font-size="26">G</text>
      <text x="500" y="72" font-size="26">A</text>
      <text x="600" y="72" font-size="26">B</text>
      <text x="650" y="72" font-size="26">C</text>
    </g>
    <g font-weight="700" fill="#14213d">
      <text x="100" y="75" font-size="20">C#</text>
      <text x="200" y="75" font-size="20">D#</text>
      <text x="350" y="75" font-size="20">F#</text>
      <text x="450" y="75" font-size="20">G#</text>
      <text x="550" y="75" font-size="20">A#</text>
    </g>
  </g>
</svg>
