<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAIkael paquete fuente</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font: 700 14px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(45deg, rgba(0,0,0,.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(0,0,0,.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(0,0,0,.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(0,0,0,.035) 75%),
        #f6f6f4;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-size: 24px 24px;
    }
    h1 { margin: 0 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }
    article {
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(255,255,255,.72);
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    img {
      width: 128px;
      height: 128px;
      object-fit: contain;
    }
    span { text-align: center; }
  </style>
</head>
<body>
  <h1>MAIkael paquete fuente</h1>
  <section class="grid">

    <article><img src="source-assets/07_cana.png" alt=""><span>07_cana.png</span></article>

    <article><img src="source-assets/10_neutra.png" alt=""><span>10_neutra.png</span></article>
